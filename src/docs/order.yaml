paths:
  /api/orders:
    post:
      tags:
        - Orders
      summary: Crea un pedido
      description: Crea un pedido para un usuario existente. El estado inicial es siempre pending.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user
              properties:
                user:
                  type: string
                  description: ID del usuario que realiza el pedido
                  example: 6af0df240fca0b10008a87d4
                priority:
                  type: string
                  enum: [low, medium, high]
                  description: Prioridad del pedido (por defecto medium)
                  example: high
                items:
                  type: array
                  description: Productos del pedido (opcional)
                  items:
                    $ref: '#/components/schemas/OrderItem'
      responses:
        '201':
          description: Pedido creado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Order'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation:
                  summary: Falta el usuario o la prioridad no es válida
                  value:
                    status: error
                    code: VALIDATION_ERROR
                    message: Los datos proporcionados no son válidos
                invalidId:
                  summary: El ID de usuario no tiene formato válido
                  value:
                    status: error
                    code: INVALID_ID
                    message: El ID proporcionado no es válido
        '404':
          description: El usuario no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: USER_NOT_FOUND
                message: Usuario no encontrado
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: INTERNAL_SERVER_ERROR
                message: Error interno del servidor

    get:
      tags:
        - Orders
      summary: Lista los pedidos
      description: Devuelve los pedidos paginados, del más nuevo al más antiguo, con los datos del usuario. Solo se aceptan los filtros status y priority; cualquier otro parámetro se ignora.
      parameters:
        - in: query
          name: status
          required: false
          description: Filtra por estado
          schema:
            type: string
            enum: [pending, processing, completed, cancelled]
        - in: query
          name: priority
          required: false
          description: Filtra por prioridad
          schema:
            type: string
            enum: [low, medium, high]
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Lista de pedidos
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Order'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '400':
          description: Parámetros de paginación o filtros inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                paginacionInvalida:
                  summary: page o limit no son válidos
                  value:
                    status: error
                    code: INVALID_PAGINATION
                    message: Los parámetros de paginación no son válidos. page debe ser un numero entero mayor a 0 y limit debe ser un numero entero entre 1 y 100
                filtroInvalido:
                  summary: El filtro no es un texto simple
                  value:
                    status: error
                    code: INVALID_FILTERS
                    message: Los filtros proporcionados no son válidos
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: INTERNAL_SERVER_ERROR
                message: Error interno del servidor

  /api/orders/{id}:
    get:
      tags:
        - Orders
      summary: Obtiene un pedido por ID
      parameters:
        - in: path
          name: id
          required: true
          description: ID del pedido
          schema:
            type: string
            example: 6af0df240fca0b10008a87d4
      responses:
        '200':
          description: Pedido encontrado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Order'
        '400':
          description: ID inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: INVALID_ID
                message: El ID proporcionado no es válido
        '404':
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: ORDER_NOT_FOUND
                message: Orden no encontrada
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: INTERNAL_SERVER_ERROR
                message: Error interno del servidor

  /api/orders/{id}/status:
    patch:
      tags:
        - Orders
      summary: Cambia el estado de un pedido
      parameters:
        - in: path
          name: id
          required: true
          description: ID del pedido
          schema:
            type: string
            example: 6af0df240fca0b10008a87d4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pending, processing, completed, cancelled]
                  example: completed
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Order'
        '400':
          description: ID o estado inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                idInvalido:
                  summary: El ID no es válido
                  value:
                    status: error
                    code: INVALID_ID
                    message: El ID proporcionado no es válido
                estadoInvalido:
                  summary: El estado no es válido o falta
                  value:
                    status: error
                    code: INVALID_STATUS
                    message: Estado inválido
                jsonInvalido:
                  summary: El body no es un JSON válido
                  value:
                    status: error
                    code: INVALID_JSON
                    message: JSON inválido
        '404':
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: ORDER_NOT_FOUND
                message: Orden no encontrada
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: INTERNAL_SERVER_ERROR
                message: Error interno del servidor
