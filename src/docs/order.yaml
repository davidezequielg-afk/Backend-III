paths:
  /api/orders:
    get:
      tags:
        - Orders
      summary: Lista los pedidos
      description: Devuelve todos los pedidos con los datos del usuario. Los parámetros de query se usan como filtro.
      parameters:
        - in: query
          name: status
          required: false
          description: Filtra por estado
          schema:
            type: string
            enum: [pending, processing, completed, cancelled]
        - in: query
          name: priority
          required: false
          description: Filtra por prioridad
          schema:
            type: string
            enum: [low, medium, high]
      responses:
        '200':
          description: Lista de pedidos
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Order'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: INTERNAL_SERVER_ERROR
                message: Error interno del servidor

  /api/orders/{id}:
    get:
      tags:
        - Orders
      summary: Obtiene un pedido por ID
      parameters:
        - in: path
          name: id
          required: true
          description: ID del pedido
          schema:
            type: string
            example: 6af0df240fca0b10008a87d4
      responses:
        '200':
          description: Pedido encontrado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Order'
        '400':
          description: ID inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: INVALID_ID
                message: El ID proporcionado no es válido
        '404':
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: ORDER_NOT_FOUND
                message: Orden no encontrada
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: INTERNAL_SERVER_ERROR
                message: Error interno del servidor

  /api/orders/{id}/status:
    patch:
      tags:
        - Orders
      summary: Cambia el estado de un pedido
      parameters:
        - in: path
          name: id
          required: true
          description: ID del pedido
          schema:
            type: string
            example: 6af0df240fca0b10008a87d4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pending, processing, completed, cancelled]
                  example: completed
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Order'
        '400':
          description: ID o estado inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                idInvalido:
                  summary: El ID no es válido
                  value:
                    status: error
                    code: INVALID_ID
                    message: El ID proporcionado no es válido
                estadoInvalido:
                  summary: El estado no es válido o falta
                  value:
                    status: error
                    code: INVALID_STATUS
                    message: Estado inválido
                jsonInvalido:
                  summary: El body no es un JSON válido
                  value:
                    status: error
                    code: INVALID_JSON
                    message: JSON inválido
        '404':
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: ORDER_NOT_FOUND
                message: Orden no encontrada
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: INTERNAL_SERVER_ERROR
                message: Error interno del servidor
