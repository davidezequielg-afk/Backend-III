components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        code:
          type: string
          example: USER_NOT_FOUND
        message:
          type: string
          example: Usuario no encontrado

    SuccessResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: object

    User:
      type: object
      properties:
        _id:
          type: string
          example: 6aebf185c1f33263a0e648fe
        name:
          type: string
          example: David Gonzalez
        email:
          type: string
          example: david@mail.com
        role:
          type: string
          enum: [admin, user, courier]
          example: user

    OrderItem:
      type: object
      properties:
        product:
          type: string
          description: ID del producto
          example: 64f1c2a9e4b0a1b2c3d4e5f7
        quantity:
          type: integer
          minimum: 1
          example: 2

    Order:
      type: object
      properties:
        _id:
          type: string
          example: 6af0df240fca0b10008a87d4
        user:
          description: En las consultas GET viene con los datos del usuario. En la respuesta del PATCH viene solo el ID.
          oneOf:
            - type: string
              example: 6af0df240fca0b10008a87cf
            - $ref: '#/components/schemas/User'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        status:
          type: string
          enum: [pending, processing, completed, cancelled]
          example: completed
        priority:
          type: string
          enum: [low, medium, high]
          example: medium
        createdAt:
          type: string
          format: date-time
          example: 2026-11-08T20:44:20.453Z
        updatedAt:
          type: string
          format: date-time
          example: 2026-11-08T20:44:20.453Z

    Delivery:
      type: object
      properties:
        _id:
          type: string
          example: 6af0df240fca0b10008a87e1
        order:
          description: En las consultas GET viene con los datos del pedido. En la respuesta del PATCH viene solo el ID.
          oneOf:
            - type: string
              example: 6af0df240fca0b10008a87d4
            - $ref: '#/components/schemas/Order'
        courier:
          type: string
          description: ID del repartidor (usuario con rol courier). Puede no existir.
          example: 6af0df240fca0b10008a87cf
        status:
          type: string
          enum: [pending, in_transit, delivered, cancelled]
          example: in_transit
        createdAt:
          type: string
          format: date-time
          example: 2026-11-08T20:44:20.453Z
        updatedAt:
          type: string
          format: date-time
          example: 2026-11-08T20:44:20.453Z

