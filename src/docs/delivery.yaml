paths:
  /api/deliveries:
    get:
      tags:
        - Deliveries
      summary: Lista las entregas
      description: Devuelve las entregas paginadas, de la más nueva a la más antigua, con los datos del pedido. Solo se acepta el filtro status; cualquier otro parámetro se ignora.
      parameters:
        - in: query
          name: status
          required: false
          description: Filtra por estado
          schema:
            type: string
            enum: [pending, in_transit, delivered, cancelled]
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Lista de entregas
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Delivery'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '400':
          description: Parámetros de paginación o filtros inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                paginacionInvalida:
                  summary: page o limit no son válidos
                  value:
                    status: error
                    code: INVALID_PAGINATION
                    message: Los parámetros de paginación no son válidos. page debe ser un numero entero mayor a 0 y limit debe ser un numero entero entre 1 y 100
                filtroInvalido:
                  summary: El filtro no es un texto simple
                  value:
                    status: error
                    code: INVALID_FILTERS
                    message: Los filtros proporcionados no son válidos
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: INTERNAL_SERVER_ERROR
                message: Error interno del servidor

  /api/deliveries/{id}:
    get:
      tags:
        - Deliveries
      summary: Obtiene una entrega por ID
      parameters:
        - in: path
          name: id
          required: true
          description: ID de la entrega
          schema:
            type: string
            example: 6af0df240fca0b10008a87e1
      responses:
        '200':
          description: Entrega encontrada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Delivery'
        '400':
          description: ID inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: INVALID_ID
                message: El ID proporcionado no es válido
        '404':
          description: Entrega no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: DELIVERY_NOT_FOUND
                message: Entrega no encontrada
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: INTERNAL_SERVER_ERROR
                message: Error interno del servidor

  /api/deliveries/{id}/status:
    patch:
      tags:
        - Deliveries
      summary: Cambia el estado de una entrega
      parameters:
        - in: path
          name: id
          required: true
          description: ID de la entrega
          schema:
            type: string
            example: 6af0df240fca0b10008a87e1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pending, in_transit, delivered, cancelled]
                  example: delivered
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Delivery'
        '400':
          description: ID o estado inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                idInvalido:
                  summary: El ID no es válido
                  value:
                    status: error
                    code: INVALID_ID
                    message: El ID proporcionado no es válido
                estadoInvalido:
                  summary: El estado no es válido o falta
                  value:
                    status: error
                    code: INVALID_STATUS
                    message: Estado inválido
                jsonInvalido:
                  summary: El body no es un JSON válido
                  value:
                    status: error
                    code: INVALID_JSON
                    message: JSON inválido
        '404':
          description: Entrega no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: DELIVERY_NOT_FOUND
                message: Entrega no encontrada
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: INTERNAL_SERVER_ERROR
                message: Error interno del servidor

  /api/deliveries/{id}/receipts:
    post:
      tags:
        - Deliveries
      summary: Sube un comprobante de una entrega
      description: Recibe un archivo (PDF, JPG o PNG, máximo 2 MB), lo guarda en el servidor y registra sus metadatos en la entrega. El tipo de documento queda fijo como receipt.
      parameters:
        - in: path
          name: id
          required: true
          description: ID de la entrega
          schema:
            type: string
            example: 6af0df240fca0b10008a87e1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Archivo a subir. El campo debe llamarse file
      responses:
        '201':
          description: Comprobante cargado y asociado a la entrega
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Delivery'
        '400':
          description: Archivo o datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                fileRequired:
                  summary: No se envió el archivo
                  value:
                    status: error
                    code: FILE_REQUIRED
                    message: El archivo es obligatorio
                invalidFileType:
                  summary: El tipo de archivo no está permitido
                  value:
                    status: error
                    code: INVALID_FILE_TYPE
                    message: El tipo de archivo no está permitido. Solo se aceptan PDF, JPG y PNG
                invalidFileField:
                  summary: El archivo no se envió en el campo file
                  value:
                    status: error
                    code: INVALID_FILE_FIELD
                    message: El campo del archivo no es el esperado. Debe enviarse en el campo "file"
                invalidId:
                  summary: El ID de la entrega no es válido
                  value:
                    status: error
                    code: INVALID_ID
                    message: El ID proporcionado no es válido
        '404':
          description: La entrega no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: DELIVERY_NOT_FOUND
                message: Entrega no encontrada
        '413':
          description: El archivo supera el tamaño máximo de 2 MB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: FILE_TOO_LARGE
                message: El archivo supera el tamaño máximo permitido de 2 MB
        '500':
          description: Error al guardar el archivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: FILE_SAVE_FAILED
                message: Error al guardar el archivo
