paths:
  /api/deliveries:
    get:
      tags:
        - Deliveries
      summary: Lista las entregas
      description: Devuelve todas las entregas con los datos del pedido. Los parámetros de query se usan como filtro.
      parameters:
        - in: query
          name: status
          required: false
          description: Filtra por estado
          schema:
            type: string
            enum: [pending, in_transit, delivered, cancelled]
      responses:
        '200':
          description: Lista de entregas
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Delivery'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: INTERNAL_SERVER_ERROR
                message: Error interno del servidor

  /api/deliveries/{id}:
    get:
      tags:
        - Deliveries
      summary: Obtiene una entrega por ID
      parameters:
        - in: path
          name: id
          required: true
          description: ID de la entrega
          schema:
            type: string
            example: 6af0df240fca0b10008a87e1
      responses:
        '200':
          description: Entrega encontrada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Delivery'
        '400':
          description: ID inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: INVALID_ID
                message: El ID proporcionado no es válido
        '404':
          description: Entrega no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: DELIVERY_NOT_FOUND
                message: Entrega no encontrada
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: INTERNAL_SERVER_ERROR
                message: Error interno del servidor

  /api/deliveries/{id}/status:
    patch:
      tags:
        - Deliveries
      summary: Cambia el estado de una entrega
      parameters:
        - in: path
          name: id
          required: true
          description: ID de la entrega
          schema:
            type: string
            example: 6af0df240fca0b10008a87e1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pending, in_transit, delivered, cancelled]
                  example: delivered
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Delivery'
        '400':
          description: ID o estado inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                idInvalido:
                  summary: El ID no es válido
                  value:
                    status: error
                    code: INVALID_ID
                    message: El ID proporcionado no es válido
                estadoInvalido:
                  summary: El estado no es válido o falta
                  value:
                    status: error
                    code: INVALID_STATUS
                    message: Estado inválido
                jsonInvalido:
                  summary: El body no es un JSON válido
                  value:
                    status: error
                    code: INVALID_JSON
                    message: JSON inválido
        '404':
          description: Entrega no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: DELIVERY_NOT_FOUND
                message: Entrega no encontrada
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: INTERNAL_SERVER_ERROR
                message: Error interno del servidor
